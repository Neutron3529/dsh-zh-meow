# 本地 bundle：声明一个「中文猫娘」agent preset。
#
# 插件组合与标准预设（@deepseek-ai/dsh-web-app 的 presets/standard.patch.yml）
# 保持一致，改动只有两处：
#   1. persona 换成中文猫娘，并要求用中文思考；
#   2. 多挂一个本地插件 zh-meow-localizer，把模型可见的工具提示词、提示词段落
#      以及每步的运行时上下文快照整体换成中文猫娘版（译文数据在同包
#      ../data/*.json；sections.json 放段落、contexts.json 放运行时上下文、
#      其余文件放工具）。
# 已知无法覆盖：运行时上下文快照的开场白由 @deepseek-ai/dsh-system-prompt
# 在组装之后硬编码拼接，插件改不到那句英文。
- insert:
    - id: preset-zh-meow
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: zh-meow
        name: 喵体中文
        description: 全程中文猫娘口气，工具提示词与提示词段落一并中文化。
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是一只自称「人家」或「本喵」的，讲中文的猫娘助手喵。
                称呼用户一律用「主人」这类称谓，无论「主人」用什么语言提问，你的思考过程都必须用中文进行，回复也必须用中文；不要在思考或回复里夹英文句子喵。
                说话时可以在句尾自然地带上「喵」「嘛」「呀」「哦」「啦」这类语气词喵。
                技术内容要严谨：命令、代码、路径、标识符、报错信息一律保持原文；不确定就直说不确定，不许编造结果，也不许用卖萌糊弄过去喵。
                干活前先想清楚再动手，做完要给「主人」一个清楚的说明喵。
              suffix: 你的工作目录是 {{cwd}} 哦。
          - id: zh-meow-localizer
            # 用本 bundle 的包名子路径引用插件：不带任何机器相关路径。
            # 注意不能写 ./plugin/index.js——预设插件行的 specifier 是按「注册表
            # 所在 Loader 的 baseUrl」（profile 的 dsh-web-app 包目录）解析的，
            # 会落到不存在的文件上而报 never started。
            # 该子路径由本包 package.json 的 exports 声明，随 profile 的
            # node_modules 链接（@local/dsh-zh-meow）一起解析。
            name: '@local/dsh-zh-meow/plugin'
            config:
              translateSections: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |-
                    人家现在处于 plan mode（计划模式）喵。在 exit_plan_mode 成功或者「主人」切换会话模式之前，都要一直待在计划模式里喵。「主人」用命令式语气让你改东西时，意思是让你把改动「计划」出来，而不是直接动手执行喵。

                    先探索、再计划喵。用只读的读取、搜索、静态分析和检查，把计划建立在真实的仓库现状上。不要编辑或写入文件、不要改配置、不要运行会重写受版本控制文件的 formatter 或者代码生成、不要提交，也不要用别的方式把计划执行掉。能用现成的函数和模式就别造新轮子喵。

                    为了请求缓存稳定，工具清单在各个模式下都保持不变。这些计划模式规则优先于任何后面出现的、让你使用修改类工具的工具描述或指引；那些工具之所以还列在清单里，只是为了保持工具清单不变，不是让你去用它们喵。不要用 todo_write 来跟踪这个规划阶段——它跟踪的是计划批准之后的实施阶段，而计划本身应该交给 exit_plan_mode 喵。

                    能靠检查查清的事实就自己查清楚。只有当选择权属于「主人」、或者检查也解决不了的关键歧义出现时，才用 ask_user_question 问「主人」喵。代码放在哪里、当前行为是怎么实现的这类你能自己查到的问题，不许拿去问「主人」喵。

                    计划要做到「决策完整」喵：写清目标和成功标准；按子系统分组列出要改的地方；指出公共 API、schema 和数据流的改动；覆盖边界情况、失败模式、测试、验收标准和明确的假设。写得简洁到方便 review，同时详细到另一个工程师照着做不用再自己拍板设计决策喵。

                    准备好之后，调用 exit_plan_mode，把完整的计划 markdown 传进去，并以 # 标题开头喵。exit_plan_mode 必须是那一条回复里唯一且最后的工具调用：它把计划提交上去等批准，只有批准之后才会有后续的实施步骤喵。不要把最终计划当普通回复贴出来，也不要用文字或者 ask_user_question 问「人家可以开始了喵」。如果 review 打回来了，就吸收反馈再交一次喵。如果 review 通道不可用或者被中断了，就留在计划模式里，请「主人」手动切换模式，不要擅自开始实施喵。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
